<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sigen">
<title>Sigen</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --card-2: #F7F7FB;
  --text: #1C1C1E; --text-2: #6E6E73; --text-3: #A1A1AA;
  --border: #E5E5EA; --accent: #185FA5;
  --accent-grad: linear-gradient(135deg, #185FA5 0%, #2E7BC7 100%);
  --green: #1D9E75; --orange: #BA7517; --purple: #534AB7; --red: #D33B33;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1C1C1E; --card-2: #2C2C2E; --text: #FFF; --text-2: #98989D; --text-3: #636366; --border: #38383A; }
}
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
.app { max-width: 430px; margin: 0 auto; padding: 16px 16px 100px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px 20px; }
.header .date-label { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
.header .date-main { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-top: 2px; }
.live-badge { display: flex; align-items: center; gap: 6px; background: var(--card); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer; }
.live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 0 3px rgba(29,158,117,0.2); animation: pulse 2s infinite; }
.live-dot.stale { background: var(--orange); animation: none; }
.live-dot.error { background: var(--red); animation: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(29,158,117,0.2); } 50% { box-shadow: 0 0 0 6px rgba(29,158,117,0.1); } }
.live-badge span { font-size: 12px; font-weight: 600; }
.hero { background: var(--accent-grad); color: white; border-radius: 24px; padding: 22px 20px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(24,95,165,0.18); }
.hero-label { font-size: 13px; opacity: 0.88; letter-spacing: 0.2px; margin-bottom: 4px; }
.hero-value { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -1px; margin-bottom: 16px; }
.hero-value .unit { font-size: 22px; opacity: 0.88; font-weight: 600; }
.hero-breakdown { display: flex; gap: 18px; font-size: 13px; }
.hero-breakdown .item { display: flex; align-items: center; gap: 6px; }
.hero-breakdown .item span { opacity: 0.88; }
.hero-breakdown .item strong { font-weight: 700; }
.card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.card-title { font-size: 14px; font-weight: 600; }
.card-meta { font-size: 11px; color: var(--text-3); font-style: italic; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--card-2); padding: 12px 14px; border-radius: 14px; }
.stat-label-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stat-dot.sol { background: var(--orange); }
.stat-dot.last { background: var(--purple); }
.stat-dot.bat { background: var(--green); }
.stat-dot.nat { background: var(--text-3); }
.stat-label { font-size: 11px; color: var(--text-2); font-weight: 500; }
.stat-value { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.stat-value .stat-unit { font-size: 13px; color: var(--text-3); font-weight: 500; }
.progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.4s; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 84px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; opacity: 0.85; min-height: 4px; }
.bar.today { background: var(--green); opacity: 1; }
.bar-label { font-size: 10px; color: var(--text-3); font-weight: 500; }
.bar-label.today { color: var(--green); font-weight: 700; }
.quick-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.quick-stat { background: var(--card); border-radius: 18px; padding: 14px; }
.quick-stat-label { font-size: 10px; color: var(--text-3); font-weight: 600; letter-spacing: 0.3px; margin-bottom: 3px; }
.quick-stat-value { font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -0.3px; }
.quick-stat-value .unit { font-size: 12px; color: var(--text-3); font-weight: 500; }
.quick-stat-sub { font-size: 11px; margin-top: 5px; color: var(--text-3); }
.insight { background: rgba(186,117,23,0.1); border-radius: 16px; padding: 14px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.insight-icon { font-size: 18px; flex-shrink: 0; }
.insight-text { font-size: 12px; line-height: 1.45; color: var(--text-2); }
.insight-text strong { color: var(--text); font-weight: 700; display: block; margin-bottom: 2px; }
.error-banner { background: rgba(211,59,51,0.1); border: 1px solid rgba(211,59,51,0.3); color: var(--red); padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 12px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 0.5px solid var(--border); padding: 10px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.nav-inner { max-width: 430px; margin: 0 auto; display: flex; justify-content: space-around; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 12px; color: var(--text-3); cursor: pointer; }
.nav-item.active { color: var(--accent); }
.nav-label { font-size: 10px; font-weight: 600; }
.ico { width: 22px; height: 22px; display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="date-label" id="date-label">—</div>
      <div class="date-main" id="date-main">Laddar…</div>
    </div>
    <div class="live-badge" id="live-badge" onclick="refresh()">
      <span class="live-dot" id="live-dot"></span>
      <span id="live-text">Laddar</span>
    </div>
  </div>
  <div id="error-banner" class="error-banner" style="display:none;"></div>
  <div class="hero">
    <div class="hero-label">Besparing idag</div>
    <div class="hero-value" id="savings-total">—<span class="unit"> kr</span></div>
    <div class="hero-breakdown">
      <div class="item"><span>☀ Sol</span><strong id="savings-sol">—</strong></div>
      <div class="item"><span>⚡ Bat</span><strong id="savings-bat">—</strong></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title" id="now-title">Just nu — —</div>
      <div class="card-meta" id="now-mode">—</div>
    </div>
    <div class="stats-grid">
      <div class="stat"><div class="stat-label-row"><span class="stat-dot sol"></span><span class="stat-label">Sol</span></div><div class="stat-value" id="now-sol">— <span class="stat-unit">kW</span></div></div>
      <div class="stat"><div class="stat-label-row"><span class="stat-dot last"></span><span class="stat-label">Last</span></div><div class="stat-value" id="now-last">— <span class="stat-unit">kW</span></div></div>
      <div class="stat"><div class="stat-label-row"><span class="stat-dot bat"></span><span class="stat-label">Batteri</span></div><div class="stat-value" id="now-soc">— <span class="stat-unit">%</span></div><div class="progress-bar"><div class="progress-fill" id="now-soc-bar" style="width: 0%"></div></div></div>
      <div class="stat"><div class="stat-label-row"><span class="stat-dot nat"></span><span class="stat-label">Nät</span></div><div class="stat-value" id="now-grid">— <span class="stat-unit">kW</span></div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">Senaste 7 dagarna</div>
      <div class="card-meta" id="week-total" style="color: var(--text-2); font-style: normal; font-weight: 500;">— kr</div>
    </div>
    <div class="bars" id="week-bars"></div>
  </div>
  <div class="quick-stats">
    <div class="quick-stat">
      <div class="quick-stat-label" id="month-label">DENNA MÅNAD</div>
      <div class="quick-stat-value" id="month-value">— <span class="unit">kr</span></div>
      <div class="quick-stat-sub" id="month-sub">—</div>
    </div>
    <div class="quick-stat">
      <div class="quick-stat-label">SEDAN START</div>
      <div class="quick-stat-value" id="grand-value">— <span class="unit">kr</span></div>
      <div class="quick-stat-sub" id="grand-sub">—</div>
    </div>
  </div>
  <div class="insight" id="insight">
    <span class="insight-icon">💡</span>
    <div class="insight-text">
      <strong id="insight-title">Hämtar status…</strong>
      <span id="insight-body">Appen läser data direkt från ditt GitHub-repo.</span>
    </div>
  </div>
</div>
<div class="nav">
  <div class="nav-inner">
    <div class="nav-item active"><div class="nav-label">Idag</div></div>
    <div class="nav-item"><div class="nav-label">Historik</div></div>
    <div class="nav-item"><div class="nav-label">Insikter</div></div>
    <div class="nav-item" onclick="refresh()"><div class="nav-label">Uppdatera</div></div>
  </div>
</div>
<script>
const CONFIG = { basePath: '..', refreshSeconds: 60 };
const DAYS = ['sön','mån','tis','ons','tor','fre','lör'];
const MONTHS_LONG = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];

function fmt(v, d=2) { return (v==null||isNaN(v)) ? '—' : v.toFixed(d).replace('.', ','); }
function fmtInt(v) { return (v==null||isNaN(v)) ? '—' : Math.round(v).toLocaleString('sv-SE'); }

function setStatus(state, text) {
  document.getElementById('live-dot').className = 'live-dot' + (state==='ok' ? '' : ' '+state);
  document.getElementById('live-text').textContent = text;
}
function showError(msg) { const el=document.getElementById('error-banner'); el.textContent=msg; el.style.display='block'; }
function hideError() { document.getElementById('error-banner').style.display='none'; }

async function fetchJSON(path) {
  const r = await fetch(`${CONFIG.basePath}/${path}?t=${Date.now()}`, { cache:'no-store' });
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return r.json();
}
async function fetchText(path) {
  const r = await fetch(`${CONFIG.basePath}/${path}?t=${Date.now()}`, { cache:'no-store' });
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return r.text();
}

function updateHeader() {
  const n = new Date();
  document.getElementById('date-label').textContent = DAYS[n.getDay()]+'dag';
  document.getElementById('date-main').textContent = `${n.getDate()} ${MONTHS_LONG[n.getMonth()]}`;
}

async function loadLatest() {
  const ymd = new Date().toISOString().slice(0,10);
  const text = await fetchText(`data/raw/${ymd}.jsonl`);
  const lines = text.trim().split('\n').filter(Boolean);
  if (!lines.length) throw new Error('Tom fil');
  return JSON.parse(lines[lines.length-1]);
}

async function loadSummary() {
  try { return await fetchJSON('data/summary.json'); } catch { return null; }
}

function renderNow(latest) {
  const f = latest.flow;
  const ts = new Date(latest.ts_local);
  const hh = String(ts.getHours()).padStart(2,'0');
  const mm = String(ts.getMinutes()).padStart(2,'0');
  document.getElementById('now-title').textContent = `Just nu — ${hh}:${mm}`;
  document.getElementById('now-mode').textContent = latest.mode || '—';
  const sol = (f.pvPower||0) + (f.thirdPvPower||0);
  document.getElementById('now-sol').innerHTML = `${fmt(sol)} <span class="stat-unit">kW</span>`;
  document.getElementById('now-last').innerHTML = `${fmt(f.loadPower)} <span class="stat-unit">kW</span>`;
  const soc = f.batterySoc||0;
  document.getElementById('now-soc').innerHTML = `${fmt(soc,0)} <span class="stat-unit">%</span>`;
  document.getElementById('now-soc-bar').style.width = `${soc}%`;
  document.getElementById('now-grid').innerHTML = `${fmt(f.buySellPower||0)} <span class="stat-unit">kW</span>`;
  const ageMin = (Date.now()-ts.getTime())/60000;
  if (ageMin<8) setStatus('ok','Live');
  else if (ageMin<30) setStatus('stale', `${Math.round(ageMin)} min`);
  else setStatus('error', `${Math.round(ageMin)} min`);
}

function renderSummary(s) {
  if (!s) {
    document.getElementById('insight-title').textContent = 'Ingen aggregering ännu';
    document.getElementById('insight-body').textContent = 'Daglig sammanfattning skapas kl 03 imorgon.';
    return;
  }
  document.getElementById('grand-value').innerHTML = `${fmtInt(s.grand_total_kr)} <span class="unit">kr</span>`;
  document.getElementById('grand-sub').textContent = `${s.total_days} dagar`;
  const now = new Date();
  const tm = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const mr = (s.monthly||[]).find(m=>m.month===tm);
  document.getElementById('month-label').textContent = MONTHS_LONG[now.getMonth()].toUpperCase()+' '+now.getFullYear();
  if (mr) {
    document.getElementById('month-value').innerHTML = `${fmtInt(mr.total_kr)} <span class="unit">kr</span>`;
    const days = (s.last_30_days||[]).filter(d=>d.date.startsWith(tm)).length;
    document.getElementById('month-sub').textContent = `▲ ${fmt(days>0?mr.total_kr/days:0,0)} kr/dag`;
  }
  const ts = now.toISOString().slice(0,10);
  const tr = (s.last_30_days||[]).find(d=>d.date===ts);
  if (tr) {
    document.getElementById('savings-total').innerHTML = `${fmt(tr.total_kr)}<span class="unit"> kr</span>`;
    document.getElementById('savings-sol').textContent = fmt(tr.sol_kr);
    document.getElementById('savings-bat').textContent = fmt(tr.bat_kr);
  }
  const l7 = (s.last_30_days||[]).slice(-7);
  if (l7.length) {
    const max = Math.max(...l7.map(d=>d.total_kr),1);
    let t7 = 0;
    document.getElementById('week-bars').innerHTML = l7.map(d=>{
      t7 += d.total_kr;
      const dt = new Date(d.date);
      const it = d.date===ts;
      const h = Math.max(4, (d.total_kr/max)*70);
      return `<div class="bar-col"><div class="bar${it?' today':''}" style="height:${h}px"></div><div class="bar-label${it?' today':''}">${it?'idag':DAYS[dt.getDay()]+' '+dt.getDate()}</div></div>`;
    }).join('');
    document.getElementById('week-total').textContent = `${fmtInt(t7)} kr`;
  }
  if (tr) {
    document.getElementById('insight-title').textContent = 'Beräkning klar!';
    document.getElementById('insight-body').textContent = `Idag har du sparat ${fmt(tr.total_kr)} kr.`;
  }
}

async function refresh() {
  setStatus('stale','Hämtar…');
  hideError();
  updateHeader();
  try {
    const [l,s] = await Promise.allSettled([loadLatest(), loadSummary()]);
    if (l.status==='fulfilled') renderNow(l.value);
    else { setStatus('error','Fel'); showError('Kunde inte hämta senaste pollning.'); }
    if (s.status==='fulfilled') renderSummary(s.value);
  } catch(e) { setStatus('error','Fel'); showError('Fel: '+e.message); }
}

refresh();
setInterval(refresh, CONFIG.refreshSeconds*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
