name: Sigen Poll

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sigen-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Hamta repo
        uses: actions/checkout@v4

      - name: Satt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Polla Sigen
        env:
          SIGEN_USERNAME: ${{ secrets.SIGEN_USERNAME }}
          SIGEN_PASSWORD: ${{ secrets.SIGEN_PASSWORD }}
          SIGEN_REGION: eu
        run: python scripts/poll.py

      - name: Committa nya datapunkter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/
            if git diff --staged --quiet; then
              echo "Inga nya datapunkter"
              exit 0
            fi
            git stash
            git pull origin main --no-rebase 2>/dev/null || true
            git stash pop || true
            git add data/
            git commit -m "Sigen-data $(date -u +'%Y-%m-%d %H:%M UTC')" || true
            if git push 2>/dev/null; then
              echo "Push lyckades"
              exit 0
            fi
            echo "Push misslyckades, forsok $i"
            sleep $((i * 3))
          done
          exit 1
