name: Poll Sigen var 5 min

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-sigen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Hamta repo
        uses: actions/checkout@v4

      - name: Satt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Polla Sigen
        env:
          SIGEN_USERNAME: ${{ secrets.SIGEN_USERNAME }}
          SIGEN_PASSWORD: ${{ secrets.SIGEN_PASSWORD }}
          SIGEN_REGION: eu
        run: python scripts/poll.py

- name: Committa nya datapunkter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Försök upp till 3 gånger - om någon annan committat samtidigt
          for i in 1 2 3; do
            git add data/
            if git diff --staged --quiet; then
              echo "Inga nya datapunkter att committa"
              exit 0
            fi
            git commit -m "Sigen-data $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Hämta senaste från remote
            git fetch origin main
            # Om konflikt i JSONL: behåll BÅDA ändringar (append-mode)
            if ! git merge origin/main --no-edit -X theirs 2>/dev/null; then
              # Vid konflikt: hämta nya rader från oss och deras, sortera
              git checkout --theirs data/raw/*.jsonl 2>/dev/null || true
              git add data/
              git commit -m "Merge sigen-data $(date -u +'%Y-%m-%d %H:%M UTC')" --no-edit || true
            fi
            if git push; then
              echo "Push lyckades på försök $i"
              exit 0
            fi
            echo "Push misslyckades på försök $i, väntar..."
            sleep $((i * 5))
          done
          echo "Kunde inte pusha efter 3 försök"
          exit 1
