name: Sigen poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sigen-poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Hamta repo
        uses: actions/checkout@v4

      - name: Satt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera paket
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Polla Sigen
        env:
          SIGEN_USERNAME: ${{ secrets.SIGEN_USERNAME }}
          SIGEN_PASSWORD: ${{ secrets.SIGEN_PASSWORD }}
          SIGEN_REGION: eu
        run: python scripts/poll.py

      - name: Committa nya datapunkter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Sigen-data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          else
            echo "Inga nya datapunkter att committa"
          fi
